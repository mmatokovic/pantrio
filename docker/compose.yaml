name: pantrio
services:
  oracle-db:
    image: gvenzl/oracle-free:23-slim
    restart: unless-stopped
    environment:
      - ORACLE_PASSWORD=${ORACLE_PWD:-W0rkSuck5}
      - APP_USER=${APP_USER:-PANTRIO}
      - APP_USER_PASSWORD=${APP_USER_PASSWORD:-oraclepwd123}
      - ORACLE_DATABASE=${ORACLE_DATABASE:-XEPDB1}
    ports:
      - '1521:1521'
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./oracle:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD", "healthcheck.sh" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    container_name: pantrio-oracle-db

  zipkin:
    image: openzipkin/zipkin:3.6.1
    ports:
      - '9411:9411'
    container_name: pantrio-zipkin

  prometheus:
    image: prom/prometheus:v3.15.1
    ports:
      - '9090:9090'
    volumes:
      - prometheus-data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    container_name: pantrio-prometheus

  grafana:
    image: grafana/grafana-oss:13.0.2
    ports:
      - '3000:3000'
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini
      - ./grafana/provisioning/:/etc/grafana/provisioning/
    container_name: pantrio-grafana

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.164.0
    volumes:
      - ./otel/collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    expose:
      - '4318'
    ports:
      - '4318:4318'
    container_name: pantrio-otel-collector

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: god
      KC_BOOTSTRAP_ADMIN_PASSWORD: god
      JAVA_OPTS_APPEND: -Dkeycloak.profile.feature.upload_scripts=enabled
    command: start-dev --import-realm
    ports:
      - '8180:8080'
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    container_name: pantrio-keycloak

  app:
    depends_on:
      oracle-db:
        condition: service_healthy
      otel-collector:
        condition: service_started
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PANTRIO_DB_URL=${PANTRIO_DB_URL:-jdbc:oracle:thin:@oracle-db:1521/XEPDB1}
      - PANTRIO_DB_USER=${PANTRIO_DB_USER:-PANTRIO}
      - PANTRIO_DB_PASS=${PANTRIO_DB_PASS:-"oraclepwd123"}
      - PANTRIO_OPENFOODFACTS_HOST=${PANTRIO_OPENFOODFACTS_HOST:-https://world.openfoodfacts.org/api/v2}
      - PANTRIO_USER_PASSWORD=${PANTRIO_USER_PASSWORD:-userpwd}
      - PANTRIO_PROMETHEUS_PASSWORD=${PANTRIO_PROMETHEUS_PASSWORD:-prometheus}
      - LOG_PATH=${LOG_PATH:-/opt/logs}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
    ports:
      - '8081:8080'
    volumes:
      - app-logs:/opt/logs
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  oracle-data:
    driver: local
  prometheus-data:
    driver: local
  app-logs:
    driver: local
