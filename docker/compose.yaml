name: pantrio
services:
  oracle-db:
    image: gvenzl/oracle-free:23-slim
    restart: unless-stopped
    environment:
      - ORACLE_PASSWORD=${ORACLE_PWD:-W0rkSuck5}
      - APP_USER=${APP_USER:-PANTRIO}
      - APP_USER_PASSWORD=${APP_USER_PASSWORD:-oraclepwd123}
      - ORACLE_DATABASE=${ORACLE_DATABASE:-XEPDB1}
    ports:
      - '1521:1521'
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./oracle:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD", "healthcheck.sh" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    container_name: db

  zipkin:
    image: openzipkin/zipkin:latest
    ports:
        - '9411:9411'
    container_name: zipkin

  prometheus:
    image: prom/prometheus:latest
    ports:
        - '9090:9090'
    volumes:
        - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    container_name: prometheus

  grafana:
    image: grafana/grafana-oss:latest
    ports:
        - '3000:3000'
    volumes:
        - ./grafana/grafana.ini:/etc/grafana/grafana.ini
        - ./grafana/provisioning/:/etc/grafana/provisioning/
    container_name: grafana

  collector:
    image: otel/opentelemetry-collector-contrib:latest
    volumes:
        - ./otel/collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    expose:
      - '4318'
    ports:
      - '4318:4318'
    container_name: collector

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    environment:
        KC_BOOTSTRAP_ADMIN_USERNAME: god
        KC_BOOTSTRAP_ADMIN_PASSWORD: god
        JAVA_OPTS_APPEND: -Dkeycloak.profile.feature.upload_scripts=enabled
    command: start-dev --import-realm
    ports:
        - '8180:8080'
    volumes:
        - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    container_name: keycloak

  app:
    depends_on:
      oracle-db:
        condition: service_healthy
      collector:
        condition: service_started
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - PANTRIO_DB_URL=${PANTRIO_DB_URL:-jdbc:oracle:thin:@host.docker.internal:1521/XEPDB1}
      - PANTRIO_DB_USER=${PANTRIO_DB_USER:-PANTRIO}
      - PANTRIO_DB_PASS=${PANTRIO_DB_PASS:-"oraclepwd123"}
      - PANTRIO_OAUTH2_ISSUER_URI=${PANTRIO_OAUTH2_ISSUER_URI:-http://host.docker.internal:8180/realms/Pantrio}
      - LOG_PATH=${LOG_PATH:-/opt/logs}
    ports:
      - '8081:8080'
    volumes:
      - app-logs:/opt/logs
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  oracle-data:
    driver: local
  app-logs:
    driver: local
