receivers:
  otlp:
    protocols:
      http:
        endpoint: "0.0.0.0:4318"
exporters:
  debug:
    verbosity: detailed
  zipkin:
    endpoint: "http://zipkin:9411/api/v2/spans"
processors:
  filter/drop_actuator:
    traces:
      span:
        - attributes["http.url"] == "/actuator/prometheus"
        - attributes["http.url"] == "/actuator/health"
service:
  pipelines:
    metrics:
      receivers: [otlp]
      exporters: [debug]
    traces:
      receivers: [otlp]
      processors: [filter/drop_actuator]
      exporters: [debug, zipkin]
    logs:
      receivers: [otlp]
      exporters: [debug]
