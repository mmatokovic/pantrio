<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<div th:fragment="list" id="storage-list" class="mb-6">
  <div th:if="${storages.isEmpty()}" class="text-center text-gray-400 py-4 text-sm">
    No storages yet. Press + to add one.
  </div>
  <ul th:unless="${storages.isEmpty()}" class="flex flex-col gap-2">
    <li th:each="storage : ${storages}"
        class="flex items-center justify-between px-4 py-3 rounded-xl border border-gray-200 bg-gray-50">
      <div>
        <p class="text-sm font-medium text-gray-900" th:text="${storage.name}">Fridge</p>
        <p class="text-xs text-gray-500" th:text="${storage.description}">Kitchen</p>
      </div>
      <button
        th:attr="hx-delete='/htmx/storages/' + ${storage.id}"
        hx-target="closest li"
        hx-swap="outerHTML"
        hx-confirm="Delete this storage?"
        class="text-red-400 hover:text-red-600">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </li>
  </ul>
</div>
</body>
</html>
