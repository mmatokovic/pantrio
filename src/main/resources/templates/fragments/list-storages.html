<div class="space-y-4" th:fragment="list">
  <details class="group relative overflow-hidden rounded border border-gray-300 shadow-sm" th:each="s : ${storages}">
    <summary class="flex items-center justify-between gap-2 p-3 text-gray-700 transition-colors hover:text-gray-900 [&amp;::-webkit-details-marker]:hidden">
      <span class="text-sm font-medium" th:text="${s.name}">Storage Name</span>
      <span class="transition-transform group-open:-rotate-180">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-4">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5"></path>
        </svg>
      </span>
    </summary>
    <div class="divide-y divide-gray-300 border-t border-gray-300 bg-white">
      <div class="flex items-center justify-between px-3 py-2">
        <span class="text-sm text-gray-700" th:text="${s.description}"> Description </span>
        <button type="button" class="text-sm text-gray-700 underline transition-colors hover:text-gray-900">
          Edit
        </button>
      </div>
      <fieldset class="p-3">
        <legend class="sr-only">Checkboxes</legend>
        <div class="flex flex-col items-start gap-3" hx-target="this" hx-swap="outerHTML">
          <label for="Option1" class="inline-flex items-center gap-3">
            <input type="checkbox" class="size-5 rounded border-gray-300 shadow-sm dark:border-gray-600 dark:bg-gray-900 dark:ring-offset-gray-900 dark:checked:bg-blue-600" id="Option1">
            <span class="text-sm font-medium text-gray-700 dark:text-gray-200"> Name </span>
          </label>
        </div>
      </fieldset>
    </div>
  </details>
</div>
