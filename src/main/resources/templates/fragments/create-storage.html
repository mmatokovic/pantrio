<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<body>
<div th:fragment="modal" id="add-modal"
     class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50"
     onclick="if(event.target === this) this.classList.add('hidden')">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm mx-4 p-6">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-lg font-semibold text-gray-900">New Storage</h2>
      <button onclick="document.getElementById('add-modal').classList.add('hidden')"
              class="text-gray-400 hover:text-gray-600">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <form hx-post="/htmx/storages"
          hx-target="#storage-list"
          hx-swap="outerHTML"
          hx-on::after-request="this.reset(); document.getElementById('add-modal').classList.add('hidden')"
          class="flex flex-col gap-3">
      <div>
        <label class="block text-sm text-gray-600 mb-1">Name</label>
        <label>
          <input type="text" name="name" required class="w-full rounded-lg border border-gray-300 bg-white text-gray-900 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="e.g. Fridge, Pantry"/>
        </label>
      </div>
      <div>
        <label class="block text-sm text-gray-600 mb-1">Description</label>
        <label>
          <input type="text" name="description" class="w-full rounded-lg border border-gray-300 bg-white text-gray-900 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="e.g. Kitchen"/>
        </label>
      </div>
      <div class="flex gap-2 pt-2">
        <button type="button" onclick="document.getElementById('add-modal').classList.add('hidden')" class="flex-1 rounded-lg border border-gray-300 text-gray-700 py-2 text-sm hover:bg-gray-50">
          Cancel
        </button>
        <button type="submit" class="flex-1 rounded-lg bg-indigo-600 text-white py-2 text-sm hover:bg-indigo-700">
          Save
        </button>
      </div>
    </form>
  </div>
</div>
</body>
</html>
