<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pantrio</title>
    <script src="https://unpkg.com/htmx.org@1.9.3"></script>
    <script src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 p-6">

<h1 class="text-3xl font-bold text-center mb-6 text-indigo-600">Pantrio</h1>

<div class="space-y-6">

    <!-- STORAGE AREAS -->
    <div>
        <h2 class="text-xl font-semibold mb-2">Storage Areas</h2>
        <button
            class="bg-pink-500 text-white px-4 py-2 rounded mb-2"
            x-data @click="$dispatch('open-add-area-modal')">+ Add Area</button>

        <div id="areasTable" hx-get="/areas" hx-trigger="load" hx-target="#areasTable" hx-swap="innerHTML">
            <!-- Areas will be loaded here -->
        </div>
    </div>

    <!-- ITEMS -->
    <div>
        <h2 class="text-xl font-semibold mb-2">Items</h2>
        <div id="itemsTable" hx-get="/items" hx-trigger="load" hx-target="#itemsTable" hx-swap="innerHTML">
            <!-- Items will be loaded here -->
        </div>
    </div>

</div>

<!-- ADD AREA MODAL -->
<div
    x-data="{open:false}"
    x-on:open-add-area-modal.window="open=true"
    x-show="open"
    class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50"
    style="display:none;"
>
    <div class="bg-white rounded-lg p-6 w-96" @click.away="open=false">
        <h3 class="text-lg font-bold mb-4">New Storage Area</h3>
        <form hx-post="/areas" hx-target="#areasTable" hx-swap="innerHTML" @submit="open=false">
            <input type="text" name="name" placeholder="Area Name" class="w-full border p-2 mb-4 rounded" required>
            <div class="text-right space-x-2">
                <button type="button" @click="open=false" class="px-4 py-2 border rounded">Cancel</button>
                <button type="submit" class="px-4 py-2 bg-blue-500 text-white rounded">Add</button>
            </div>
        </form>
    </div>
</div>

<!-- ADD ITEM MODAL -->
<div
    x-data="{open:false}"
    x-on:open-add-item-modal.window="open=true"
    x-show="open"
    class="fixed inset-0 flex items-center justify-center bg-black bg-opacity-50"
    style="display:none;"
>
    <div class="bg-white rounded-lg p-6 w-96" @click.away="open=false">
        <h3 class="text-lg font-bold mb-4">Add Item to <span x-text="areaName"></span></h3>
        <form hx-post="/items" hx-target="#itemsTable" hx-swap="innerHTML" @submit="open=false">
            <input type="hidden" name="storageId" x-model="storageId">
            <input type="text" name="name" placeholder="Item Name" class="w-full border p-2 mb-2 rounded" required>
            <input type="number" name="quantity" placeholder="Quantity" class="w-full border p-2 mb-2 rounded" required>
            <input type="text" name="unit" placeholder="Unit" class="w-full border p-2 mb-4 rounded" required>
            <div class="text-right space-x-2">
                <button type="button" @click="open=false" class="px-4 py-2 border rounded">Cancel</button>
                <button type="submit" class="px-4 py-2 bg-blue-500 text-white rounded">Add</button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
