spring.application.name=pantrio
info.app.version=@project.version@

# Server Configuration
server.shutdown=graceful
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20

server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain
server.compression.min-response-size=1024

# Liquibase Configuration
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# Logging Configuration
logging.level.liquibase=INFO

management.tracing.sampling.probability=0.1
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.metrics.tags.application-name=${spring.application.name}
management.otlp.metrics.export.url=${OTEL_EXPORTER_OTLP_ENDPOINT}/v1/metrics
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT}/v1/traces

# Swagger Configuration
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Datasource Configuration
spring.jmx.unique-names=true

spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.fetch_size=50
spring.jpa.properties.hibernate.cache.use_query_cache=false
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=true

spring.datasource.hikari.auto-commit=false
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.idleTimeout=600000
spring.datasource.hikari.maxLifetime=1800000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

spring.datasource.url=${PANTRIO_DB_URL}
spring.datasource.username=${PANTRIO_DB_USER}
spring.datasource.password=${PANTRIO_DB_PASS}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# OpenFoodFacts API Configuration
openfoodfacts.host=${PANTRIO_OPENFOODFACTS_HOST}
