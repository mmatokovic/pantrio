<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <title>Pantrio</title>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="color-scheme" content="light"/>
  <script th:src="@{/htmx.min.js}"></script>
  <script th:src="@{/tailwindcss.min.js}"></script>
</head>
<body class="bg-white">
<header class="bg-white border-b border-stone-200 sticky top-0 z-10">
  <div class="mx-auto max-w-2xl px-6 py-4 flex items-center gap-3">
    <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4" />
      </svg>
    </div>
    <span class="text-lg font-semibold text-stone-900 tracking-tight">Pantrio</span>
  </div>
</header>
<main>
  <section>
    <div class="mx-auto max-w-3xl p-6">
      <span class="flex items-center mb-4">
        <span class="shrink-0 pe-4 text-gray-900  font-medium">Storage Areas</span>
        <span class="h-px flex-1 bg-gradient-to-l from-transparent to-gray-300"></span>
      </span>
      <div id="storage-list" class="mb-6">
        <div th:fragment="list" class="mb-6">
          <div th:if="${storages.isEmpty()}" class="text-center text-gray-400 py-4 text-sm">
            No storages yet. Press + to add one.
          </div>
          <ul th:unless="${storages.isEmpty()}" class="flex flex-col gap-2">
            <li th:each="storage : ${storages}"
                class="flex items-center justify-between px-4 py-3 rounded-xl border border-gray-200 bg-gray-50">
              <div>
                <p class="text-sm font-medium text-gray-900" th:text="${storage.name}">Fridge</p>
                <p class="text-xs text-gray-500" th:text="${storage.description}">Kitchen</p>
              </div>
              <button
                th:attr="hx-delete='/htmx/storages/' + ${storage.id}"
                hx-target="closest li"
                hx-swap="outerHTML"
                hx-confirm="Delete this storage?"
                class="text-red-400 hover:text-red-600">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
              </button>
            </li>
          </ul>
        </div>
      </div>
      <div class="flex justify-center">
        <button class="w-12 h-12 rounded-full bg-green-600 text-white flex items-center justify-center hover:bg-green-700" aria-label="Add new storage" onclick="document.getElementById('add-modal').classList.remove('hidden')">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
          </svg>
        </button>
      </div>
    </div>
  </section>
  <section>
    <div class="flex items-center justify-between mb-4">
      <h1 class="text-xs font-semibold uppercase tracking-widest text-stone-400 mono">Items</h1>
    </div>

    <div id="items-list">
      <div th:replace="~{fragments/list-items :: list}"></div>
    </div>
  </section>
</main>
<div th:fragment="modal" id="add-modal"
     class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50"
     onclick="if(event.target === this) this.classList.add('hidden')">
  <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm mx-4 p-6">
    <div class="flex items-center justify-between mb-4">
      <h2 class="text-lg font-semibold text-gray-900">New Storage</h2>
      <button onclick="document.getElementById('add-modal').classList.add('hidden')"
              class="text-gray-400 hover:text-gray-600">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
    <form hx-post="/htmx/storages"
          hx-target="#storage-list"
          hx-swap="outerHTML"
          class="flex flex-col gap-3">
      <div>
        <label class="block text-sm text-gray-600 mb-1">Name</label>
        <label>
          <input type="text" name="name" required class="w-full rounded-lg border border-gray-300 bg-white text-gray-900 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="e.g. Fridge, Pantry"/>
        </label>
      </div>
      <div>
        <label class="block text-sm text-gray-600 mb-1">Description</label>
        <label>
          <input type="text" name="description" class="w-full rounded-lg border border-gray-300 bg-white text-gray-900 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="e.g. Kitchen"/>
        </label>
      </div>
      <div class="flex gap-2 pt-2">
        <button type="button" onclick="document.getElementById('add-modal').classList.add('hidden')" class="flex-1 rounded-lg border border-gray-300 text-gray-700 py-2 text-sm hover:bg-gray-50">
          Cancel
        </button>
        <button type="submit" class="flex-1 rounded-lg bg-indigo-600 text-white py-2 text-sm hover:bg-indigo-700">
          Save
        </button>
      </div>
    </form>
  </div>
</div>
</body>
</html>
